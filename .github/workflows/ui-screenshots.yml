name: ui-screenshots

# Boots the debug APK on several emulator device profiles (phone / big phone /
# 7" tablet / 10" tablet + dark and landscape variants) and captures one per
# ViewPager2 page, uploaded as downloadable artifacts. Lets you eyeball layout
# across screen sizes without owning the hardware.
#
# The engine is compiled for x86_64 in-job (-PmepAbi=x86_64 via gradle/CMake):
# GitHub emulator images are x86_64 and the shipped arm64-only jniLibs .so
# cannot be used there.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Main/**'
      - '.github/workflows/ui-screenshots.yml'

defaults:
  run:
    working-directory: Main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build debug APK (x86_64 native for the emulator)
        run: |
          chmod +x gradlew
          ok=0
          for i in 1 2 3 4 5; do
            if ./gradlew assembleDebug -PmepAbi=x86_64 --console=plain; then ok=1; break; fi
            echo "gradlew attempt $i failed — retrying in 90s"
            sleep 90
          done
          [ "$ok" = 1 ]

      - uses: actions/upload-artifact@v4
        with:
          # x86_64-only engine (built via -PmepAbi=x86_64 for the CI emulators):
          # do NOT install on real arm64 phones — use the debug-build APK instead.
          name: emulator-debug-apk-x86_64-CI-ONLY-do-not-install
          path: Main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  screenshots:
    needs: build-apk
    # Pinned to 24.04: the ubuntu-26.04 image ships /dev/kvm without the runner
    # user in the kvm group, so the emulator silently falls back to TCG (software
    # emulation), never finishes booting, and adb stays "device offline".
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: pixel_4,      api: 34, dark: no,  rotation: portrait  }   # 5.7" phone, 1080x2280 @440dpi
          - { profile: pixel_6_pro,  api: 34, dark: yes, rotation: portrait  }   # 6.7" big phone, dark mode
          - { profile: pixel_4,      api: 30, dark: no,  rotation: portrait  }   # 5.7" phone on OLDER Android (API 30)
          - { profile: pixel_4,      api: 34, dark: no,  rotation: landscape }   # phone landscape (layout-land shell)
          - { profile: pixel_6_pro,  api: 34, dark: yes, rotation: landscape }   # phone landscape, dark
          - { profile: pixel_tablet, api: 34, dark: no,  rotation: landscape }   # 10.95" tablet landscape (layout-sw600dp)
          - { profile: pixel_tablet, api: 34, dark: no,  rotation: portrait  }   # 10.95" tablet portrait (same shell)
    steps:
      # Checkout: defaults.run.working-directory is "Main", so bash would fail to
      # start in the screenshots job without the repo tree being present.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: emulator-debug-apk-x86_64-CI-ONLY-do-not-install
          path: apk

      - name: Ensure KVM access (belt-and-braces if the image changes again)
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner — emulator will be slow (TCG)"
          fi

      - name: Capture screenshots (${{ matrix.profile }}, API ${{ matrix.api }}${{ matrix.dark == 'yes' && ' — dark' || '' }}${{ matrix.rotation == 'landscape' && ' — landscape' || '' }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # NOTE: this action executes EACH LINE as a separate `sh -c`
            # (see its lib/script-parser.js): variables and cd do not persist
            # across lines. Keep each logical statement on ONE line and use
            # absolute paths throughout.
            adb shell cmd uimode night ${{ matrix.dark }}
            # Landscape legs exercise layout-land/activity_main.xml. `wm user-rotation
            # lock` is the reliable switch (the settings keys are ignored on some
            # images). Rotation is flaky on these images
            # (the same command lands in different legs run to run), so re-assert
            # it and poll the display frame until width > height. One line: the
            # runner executes each line in its own `sh -c`.
            if [ "${{ matrix.rotation }}" = "portrait" ]; then PS=$(adb shell wm size | tr -d '\r' | sed -n 's/Physical size: \([0-9]*\)x\([0-9]*\).*/\1x\2/p' | head -1); PW=${PS%x*}; PH=${PS#*x*}; if [ "$PW" -gt "$PH" ]; then adb shell wm size "${PH}x${PW}"; echo "forced portrait logical size ${PH}x${PW}"; fi; fi
            if [ "${{ matrix.rotation }}" = "landscape" ]; then LOCK=1; adb shell settings put system accelerometer_rotation 0; adb shell settings put system user_rotation $LOCK; ok=0; for i in 1 2 3; do adb shell wm user-rotation lock $LOCK; sleep 3; SZ=$(adb shell dumpsys window displays 2>/dev/null | tr -d '\r' | grep -o 'cur=[0-9]*x[0-9]*' | head -1 | cut -d= -f2); echo "rotation attempt $i: ${SZ:-unknown}"; if [ -n "$SZ" ] && [ "${SZ%x*}" -gt "${SZ#*x}" ]; then ok=1; break; fi; adb shell wm user-rotation lock 0; sleep 2; done; if [ "$ok" = "1" ]; then echo "landscape via display rotation"; else PS=$(adb shell wm size | tr -d '\r' | sed -n 's/Physical size: \([0-9]*\)x\([0-9]*\).*/\1x\2/p' | head -1); PW=${PS%x*}; PH=${PS#*x*}; if [ "$PW" -gt "$PH" ]; then LS="${PW}x${PH}"; else LS="${PH}x${PW}"; fi; adb shell wm size "$LS"; echo "rotation did not stick; forced landscape logical size $LS"; fi; adb shell dumpsys window displays 2>/dev/null | tr -d '\r' | grep -oE '(init|cur|app)=[0-9]+x[0-9]+' | head -4 || true; fi
            adb install -r "$(find "$GITHUB_WORKSPACE/apk" -name '*.apk' | head -1)"
            # The app's light/dark switcher is its OWN persisted preference
            # (ecalc_prefs -> dark_mode) and deliberately ignores the system night
            # mode, so `cmd uimode night yes` alone produced light screenshots for
            # the "dark" matrix leg. Seed the preference before the first launch.
            if [ "${{ matrix.dark }}" = "yes" ]; then adb shell "run-as com.amitutilitysoft.mepcalc sh -c 'mkdir -p shared_prefs; cat > shared_prefs/ecalc_prefs.xml'" < "$GITHUB_WORKSPACE/.github/ci/dark_mode_prefs.xml"; fi
            adb shell am start -W -n com.amitutilitysoft.mepcalc/.LauncherDark
            # 40s: the startup patch sync fires a status toast when it finishes
            # (usually 5-15s in); capture only after it has had time to appear and
            # expire, otherwise the toast lands in the store screenshot.
            sleep 40
            mkdir -p "$GITHUB_WORKSPACE/shots"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/01-home.png"
            # A leg that silently captured the wrong orientation would still
            # upload under a name that says otherwise. Check the PNG header and
            # drop a marker file into the artifact so the mix-up is visible.
            IMG=$(python3 -c "import struct;d=open('$GITHUB_WORKSPACE/shots/01-home.png','rb').read(24);print(*(struct.unpack('>II',d[16:24])))"); set -- $IMG; echo "first capture: ${1}x${2}"; if { [ "${{ matrix.rotation }}" = "landscape" ] && [ "$1" -le "$2" ]; } || { [ "${{ matrix.rotation }}" = "portrait" ] && [ "$1" -ge "$2" ]; }; then echo "::warning::${{ matrix.rotation }} leg captured ${1}x${2}"; echo "expected ${{ matrix.rotation }}, got ${1}x${2}" > "$GITHUB_WORKSPACE/shots/ORIENTATION-FAILED.txt"; fi
            SZ=$(adb shell wm size | tr -d '\r' | sed -n 's/.*size: \([0-9]*x[0-9]*\).*/\1/p' | tail -1); W=${SZ%x*}; H=${SZ#*x*}; if [ "${{ matrix.rotation }}" = "landscape" ] && [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; elif [ "${{ matrix.rotation }}" = "portrait" ] && [ "$W" -gt "$H" ]; then T=$W; W=$H; H=$T; fi; X1=$((W*8/10)); X2=$((W*12/100)); Y=$((H*62/100)); for p in 1 2 3 4 5; do adb shell input swipe "$X1" "$Y" "$X2" "$Y" 600; sleep 3; adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/0$((p+1))-page$((p+1)).png"; done; ls -la "$GITHUB_WORKSPACE/shots"
            # Currency tab: a landscape fling can skip pages, so the swipe loop
            # above may not land on it. Tap the tab by its accessibility label,
            # capture a dedicated store shot, then restore the catalog tab so the
            # studio walk-back below still starts from the same page as before.
            adb shell uiautomator dump /sdcard/window_dump.xml >/dev/null 2>&1; adb pull /sdcard/window_dump.xml "$GITHUB_WORKSPACE/window_dump.xml" >/dev/null 2>&1; T=$(python3 "$GITHUB_WORKSPACE/.github/ci/tap_tab.py" "$GITHUB_WORKSPACE/window_dump.xml" "Currency Converter" 2>/dev/null || true); if [ -n "$T" ]; then adb shell input tap $T; sleep 4; SZ=$(adb shell wm size | tr -d '\r' | sed -n 's/.*size: \([0-9]*x[0-9]*\).*/\1/p' | tail -1); W=${SZ%x*}; H=${SZ#*x*}; if [ "${{ matrix.rotation }}" = "landscape" ] && [ "${{ matrix.profile }}" != "pixel_tablet" ]; then adb shell input swipe "$((W*74/100))" "$((H*62/100))" "$((W*74/100))" "$((H*47/100))" 500; sleep 2; fi; adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/08-currency.png"; fi
            adb shell uiautomator dump /sdcard/window_dump.xml >/dev/null 2>&1; adb pull /sdcard/window_dump.xml "$GITHUB_WORKSPACE/window_dump.xml" >/dev/null 2>&1; T=$(python3 "$GITHUB_WORKSPACE/.github/ci/tap_tab.py" "$GITHUB_WORKSPACE/window_dump.xml" "All Functions (stdlib + patches + project1)" 2>/dev/null || true); if [ -n "$T" ]; then adb shell input tap $T; sleep 3; fi
            # 7th shot: the .math Studio page, reached with the app's own gesture
            # (swipe left across the display). Walk back to the first keypad page
            # first so the swipe starts on a page that owns the gesture.
            SZ=$(adb shell wm size | tr -d '\r' | sed -n 's/.*size: \([0-9]*x[0-9]*\).*/\1/p' | tail -1); W=${SZ%x*}; H=${SZ#*x*}; if [ "${{ matrix.rotation }}" = "landscape" ] && [ "$W" -lt "$H" ]; then T=$W; W=$H; H=$T; elif [ "${{ matrix.rotation }}" = "portrait" ] && [ "$W" -gt "$H" ]; then T=$W; W=$H; H=$T; fi; Y=$((H*62/100)); if [ "${{ matrix.rotation }}" = "landscape" ] || [ "${{ matrix.profile }}" = "pixel_tablet" ]; then RX1=$((W*56/100)); RX2=$((W*92/100)); else RX1=$((W*12/100)); RX2=$((W*80/100)); fi; for p in 1 2 3 4 5; do adb shell input swipe "$RX1" "$Y" "$RX2" "$Y" 300; sleep 1; done; if [ "${{ matrix.rotation }}" = "landscape" ] || [ "${{ matrix.profile }}" = "pixel_tablet" ]; then adb shell input swipe "$((W*38/100))" "$((H*50/100))" "$((W*6/100))" "$((H*50/100))" 400; else adb shell input swipe "$((W*80/100))" "$((H*22/100))" "$((W*15/100))" "$((H*22/100))" 400; fi; sleep 6; adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/07-studio.png"; ls -la "$GITHUB_WORKSPACE/shots"

      - uses: actions/upload-artifact@v4
        with:
          # API level in the name: two matrix slots share profile pixel_4 (API 34 / API 30)
          name: screenshots-${{ matrix.profile }}-api${{ matrix.api }}${{ matrix.dark == 'yes' && '-dark' || '' }}${{ matrix.rotation == 'landscape' && '-land' || '' }}
          # shots/ (not shots/*.png): ORIENTATION-FAILED.txt must travel
          # with the images when a leg captures the wrong orientation.
          path: shots/
          if-no-files-found: error
